<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labyrinth Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Patrick+Hand&display=swap">
<style>
:root{--page:#F6F2EC;--screen:#FFFDF9;--ink:#1B1B1B;--muted:#6B6660;--line:#E2DCD3;--orange:#E05524;--orange-ink:#C8461A;
  --sans:"Figtree",ui-sans-serif,system-ui,sans-serif;--hand:"Patrick Hand","Comic Sans MS",cursive}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden}
/* fixed 1920×1080 stage; scaled to the window when watched live */
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--fit,1));background:var(--page);color:var(--ink);font-family:var(--sans)}

.panel{position:absolute;left:150px;top:0;width:820px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px}
.panel > *{transition:opacity .35s,transform .35s}
.panel.out > *{opacity:0;transform:translateY(14px)}
.eyebrow{font:700 22px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--orange-ink)}
h1{margin:0;font:800 84px/1.0 var(--sans);letter-spacing:-.03em;text-wrap:balance}
.body{margin:0;font:400 34px/1.35 var(--sans);color:#3d3a36;max-width:24ch}
.note{margin:4px 0 0;font:400 40px var(--hand);color:var(--orange-ink)}
.logo{width:96px;height:96px}

.chapters{position:absolute;left:150px;bottom:118px;display:flex;gap:44px}
.chapters div{display:flex;align-items:baseline;gap:10px;font:700 26px var(--sans);color:#B8B0A5;transition:color .3s}
.chapters b{color:inherit}
.chapters .on{color:var(--ink)}
.chapters .on b{color:var(--orange)}
.foot{position:absolute;left:150px;width:960px;bottom:52px;padding-top:18px;border-top:1.5px solid var(--line);font:400 20px var(--sans);color:var(--muted)}

/* line-art iPhone 18 Pro Max around the live app */
.handset{position:absolute;left:1240px;top:58px;border:4px solid var(--ink);border-radius:68px;background:var(--screen)}
.hw{position:absolute;width:7px;border:2.5px solid var(--ink);background:var(--screen)}
.hw.l{left:-10px;border-right:0;border-radius:4px 0 0 4px}.hw.r{right:-10px;border-left:0;border-radius:0 4px 4px 0}
.hw.action{top:178px;height:36px}.hw.volup{top:250px;height:62px}.hw.voldn{top:326px;height:62px}
.hw.side{top:270px;height:100px}.hw.cam{top:560px;height:56px}
iframe{display:block;width:440px;height:956px;border:0;border-radius:64px;background:var(--screen)}

.tap{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:5px solid var(--orange);background:rgb(224 85 36 / .18);pointer-events:none;opacity:0}
.tap.go{animation:tap .55s ease-out}
@keyframes tap{0%{transform:scale(.5);opacity:0}35%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
</style>

<div class="stage" id="stage">
  <div class="panel" id="panel"></div>
  <div class="chapters" id="chapters">
    <div data-ch="1"><b>1</b>Forgot-to-lock alert</div>
    <div data-ch="2"><b>2</b>Tamper alarm</div>
    <div data-ch="3"><b>3</b>Location</div>
  </div>
  <div class="foot">Team 1 · Schoot · Concept prototype for testing, not a working product</div>
  <div class="handset">
    <i class="hw l action"></i><i class="hw l volup"></i><i class="hw l voldn"></i><i class="hw r side"></i><i class="hw r cam"></i>
    <iframe id="app" src="index.html" title="Labyrinth app"></iframe>
  </div>
  <div class="tap" id="tap"></div>
</div>

<script>
const stage = document.getElementById('stage'), panel = document.getElementById('panel'), frame = document.getElementById('app');
const wait = ms => new Promise(r => setTimeout(r, ms));
const fit = () => stage.style.setProperty('--fit', Math.min(innerWidth/1920, innerHeight/1080));
fit(); addEventListener('resize', fit);

// the app sees a 440 px viewport and would switch to its full-screen phone layout; keep the framed spacing instead
const FRAMED = `.sysbar{display:grid!important}.screen{padding-top:70px!important}.map-screen .top{padding-top:66px!important}
  .banner{top:58px!important}.overlay{padding-top:70px!important}
  .overlay .fine:last-child{display:none}`; // silent video: drop the "siren plays on this phone" note

let app, doc;
async function caption({eyebrow = '', title, body = '', note = '', ch = 0, logo = false}){
  panel.classList.add('out'); await wait(350);
  panel.innerHTML = (logo ? `<svg class="logo" viewBox="0 0 180 180">${app.logoSVG()}</svg>` : '')
    + (eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : '') + `<h1>${title}</h1>`
    + (body ? `<p class="body">${body}</p>` : '') + (note ? `<p class="note">${note}</p>` : '');
  document.querySelectorAll('[data-ch]').forEach(d => d.classList.toggle('on', +d.dataset.ch === ch));
  panel.classList.remove('out');
}
async function tap(sel){
  const el = doc.querySelector(sel), r = el.getBoundingClientRect(), f = frame.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const k = 1920 / s.width; // stage may be scaled when watched live
  const ring = document.getElementById('tap');
  ring.style.left = ((f.left - s.left)*k + r.left + r.width/2) + 'px';
  ring.style.top  = ((f.top  - s.top)*k  + r.top  + r.height/2) + 'px';
  ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
  await wait(380); el.click(); await wait(250);
}

async function run(){
  await caption({logo:true, title:'Labyrinth', body:'A smart bike lock with a companion app, for Schoot residents with a valuable e-bike.',
    note:'“Lock it, leave it and know it\'s safe”'});
  await wait(3600);

  await caption({eyebrow:'My e-bike', title:'Locked, and right where she left it',
    body:'Sophie sees at a glance that her e-bike is locked, and where it is.'});
  await wait(4300);

  await caption({ch:1, eyebrow:'1 · Forgot-to-lock alert', title:'Walk away unlocked? Your phone tells you.',
    body:'Lock it from the app, without walking back.'});
  await wait(700);  await tap('#lockBtn');
  await wait(1300); app.fire('forgot');
  await wait(1600); await tap('#banner');
  await wait(1500); await tap('[data-act=locknow]');
  await wait(500);  await tap('[data-tab=home]');
  await wait(1700);

  await caption({ch:2, eyebrow:'2 · Tamper alarm', title:'Someone forces the lock? Sound the alarm.',
    body:'An alert arrives the moment the lock is opened without the key.', note:'Don\'t go after a thief yourself.'});
  await wait(600);  app.fire('tamper');
  await wait(1600); await tap('#banner');
  await wait(1500); await tap('[data-act=alarm]');
  await wait(2400); await tap('#stopAlarm');
  await wait(900);  await tap('[data-act=me]');
  await wait(900);

  await caption({ch:3, eyebrow:'3 · Location', title:'See where the bike is, and where it went.',
    body:'The map shows its last known spot and the route it took.'});
  await wait(600);  app.fire('moved');
  await wait(1600); await tap('#banner');
  await wait(1400); await tap('[data-act=map]');
  await wait(3400);

  await caption({eyebrow:'Next step', title:'Test it with 10+ Schoot residents',
    body:'Goal: lock up in under a minute, and trust the bike is still there tomorrow.', note:'“Lock it, leave it and know it\'s safe”'});
  await wait(4200);
  window.walkthroughDone = true;
}

frame.addEventListener('load', async () => {
  app = frame.contentWindow; doc = frame.contentDocument;
  const st = doc.createElement('style'); st.textContent = FRAMED; doc.head.appendChild(st);
  await Promise.all([document.fonts.ready, doc.fonts.ready]);
  window.walkthroughReady = true;
  // #rec: the recorder starts the timeline itself, so frame one is the title card
  if (location.hash === '#rec') window.startWalkthrough = run; else run();
});
</script>
